[project]
name = "ai-skills-match-engine"
version = "0.1.0"
description = "Deterministic AI Skills Matching Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "flashtext>=2.7",
    "supabase>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pypdf>=4.0.0",
    "python-magic>=0.4.27",
    "networkx>=3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
